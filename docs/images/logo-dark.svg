<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><style>
.c{opacity:0;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.s{opacity:0;animation:fade .4s .75s ease-out both}
.f{transform-box:fill-box;transform-origin:center;transform:rotate(-12deg);animation:drop .6s .8s cubic-bezier(.3,1.4,.5,1) both,float 3.2s 1.6s ease-in-out infinite}
.t{opacity:0;animation:slide .6s .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes fade{to{opacity:1}}
@keyframes drop{from{opacity:0;transform:translateY(-24px) rotate(10deg)}40%{opacity:1}to{opacity:1;transform:rotate(-12deg)}}
@keyframes float{0%,100%{transform:rotate(-12deg)}50%{transform:translateY(-2px) rotate(-9deg)}}
@keyframes slide{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.c,.s,.t,.f{animation:none;opacity:1}.f{transform:rotate(-12deg)}}</style><g fill="#FAFAF8"><rect class="c" style="animation-delay:0.00s" x="21.5" y="22" width="17" height="17" rx="2.5"/><rect class="c" style="animation-delay:0.06s" x="21.5" y="42" width="17" height="17" rx="2.5"/><rect class="c" style="animation-delay:0.12s" x="21.5" y="62" width="17" height="17" rx="2.5"/><rect class="c" style="animation-delay:0.18s" x="21.5" y="82" width="17" height="17" rx="2.5"/><rect class="c" style="animation-delay:0.24s" x="41.5" y="82" width="17" height="17" rx="2.5"/><rect class="c" style="animation-delay:0.30s" x="61.5" y="82" width="17" height="17" rx="2.5"/><rect class="c" style="animation-delay:0.36s" x="61.5" y="62" width="17" height="17" rx="2.5"/><rect class="c" style="animation-delay:0.42s" x="61.5" y="42" width="17" height="17" rx="2.5"/></g><g class="s"><g fill="#FAFAF8" opacity="0.35"><circle cx="50" cy="30.5" r="1.8"/><circle cx="50" cy="50.5" r="1.8"/><circle cx="50" cy="70.5" r="1.8"/></g><rect x="62.5" y="23" width="15" height="15" rx="2" fill="none" stroke="#FAFAF8" stroke-opacity="0.39999999999999997" stroke-width="1.5" stroke-dasharray="2.5 2.5"/></g><rect class="f" x="62.5" y="2" width="17" height="17" rx="2.5" fill="#7C5CFF"/></svg>
